<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Scan QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#0b1220; color:#fff; }
    .wrap { max-width:720px; margin:0 auto; padding:16px; }
    h1 { font-size:18px; margin:12px 0; opacity:.9; }
    #scanner { width:100%; aspect-ratio:3/4; background:#111; border-radius:12px; overflow:hidden; }

    /* Default: apply an extra horizontal flip so mirrored front feeds look normal */
    #scanner video, #scanner canvas {
      transform: scaleX(-1) !important;
      -webkit-transform: scaleX(-1) !important;
      transform-origin: center center !important;
      -webkit-transform-origin: center center !important;
    }

    /* When we toggle “no-flip”, show raw feed */
    #scanner.no-flip video, #scanner.no-flip canvas {
      transform: none !important;
      -webkit-transform: none !important;
    }

    .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    button, select { flex:1; padding:12px; border-radius:10px; border:0; font-weight:600; }
    button { background:#18a0fb; color:#fff; }
    button.stop { background:#d9534f; }
    .status { margin-top:10px; min-height:24px; font-size:14px; opacity:.9; }
    .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; background:rgba(0,0,0,.7); padding:10px 14px; border-radius:10px; font-size:14px; display:none; }
  </style>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <div class="wrap">
    <h1>Ready to scan</h1>

    <div id="scanner"></div>

    <div class="row">
      <button id="frontBtn" type="button">Front camera</button>
      <button id="backBtn"  type="button">Back camera</button>
      <button id="flipBtn"  type="button" title="If preview looks mirrored, tap to toggle">Fix preview</button>
    </div>
    <div class="row">
      <select id="cameraSelect" title="Camera (advanced)"></select>
      <button id="startBtn">Start</button>
      <button id="stopBtn" class="stop" disabled>Stop</button>
    </div>

    <div class="status" id="status">Opening camera…</div>
    <div id="toast" class="toast"></div>
    <audio id="beep" preload="auto">
      <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABYAAAACAAACAgAA" type="audio/wav">
    </audio>
  </div>

  <script>
  const scannerEl = document.getElementById('scanner');
  const startBtn  = document.getElementById('startBtn');
  const stopBtn   = document.getElementById('stopBtn');
  const camSel    = document.getElementById('cameraSelect');
  const statusEl  = document.getElementById('status');
  const beepEl    = document.getElementById('beep');
  const frontBtn  = document.getElementById('frontBtn');
  const backBtn   = document.getElementById('backBtn');
  const flipBtn   = document.getElementById('flipBtn');
  const toastEl   = document.getElementById('toast');

  let html5Qrcode;
  let running = false;
  let lastCode = null;
  let lastScanAt = 0;

  const COOLDOWN_MS = 2500;
  const setStatus = (m) => statusEl.textContent = m;
  const toast = (m) => { toastEl.textContent = m; toastEl.style.display='block'; setTimeout(()=>toastEl.style.display='none',1400); };
  const isFrontLabel = s => /front|selfie|user|inner|face/i.test(s || "");
  const isBackLabel  = s => /back|rear|environment|world|outward/i.test(s || "");

  async function ensureInstance() {
    if (!html5Qrcode) html5Qrcode = new Html5Qrcode('scanner', { verbose:false });
  }

  async function listCameras() {
    try {
      const cams = await Html5Qrcode.getCameras();
      camSel.innerHTML = '';
      cams.forEach((c,i)=>{
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.label || `Camera ${i+1}`;
        camSel.appendChild(opt);
      });
      return cams;
    } catch (e) {
      console.warn(e);
      setStatus('Unable to list cameras. Check permissions.');
      return [];
    }
  }

  async function stop() {
    if (!running) return;
    try { await html5Qrcode.stop(); } catch {}
    running = false;
    startBtn.disabled = false;
    stopBtn.disabled  = true;
  }

  async function startWith(constraint) {
    await ensureInstance();
    await stop();

    const config = {
      fps: 10,
      qrbox: { width: 320, height: 320 },
      aspectRatio: 1.333,
      disableFlip: true,              // keep library from flipping
      rememberLastUsedCamera: true
    };

    try {
      await html5Qrcode.start(constraint, config, onScanSuccess, onScanFailure);
      running = true;
      startBtn.disabled = true;
      stopBtn.disabled  = false;
      setStatus('Scanning…');
      return true;
    } catch (e) {
      console.warn('start failed', constraint, e);
      setStatus('Camera start failed. Try another device / button.');
      return false;
    }
  }

  async function startFront() {
    // Prefer constraint approach
    if (await startWith({ facingMode: "user" })) {
      localStorage.setItem('lastFacing', 'user');
      return;
    }
    // Fallback by label
    await listCameras();
    let opt = [...camSel.options].find(o => isFrontLabel(o.textContent));
    if (!opt && camSel.options.length) opt = camSel.options[camSel.options.length-1];
    if (opt) {
      camSel.value = opt.value;
      await startWith({ deviceId: { exact: opt.value } });
      localStorage.setItem('lastFacing', 'user');
    } else {
      setStatus('No front camera found.');
    }
  }

  async function startBack() {
    if (await startWith({ facingMode: "environment" })) {
      localStorage.setItem('lastFacing', 'environment');
      return;
    }
    await listCameras();
    let opt = [...camSel.options].find(o => isBackLabel(o.textContent));
    if (!opt && camSel.options.length) opt = camSel.options[0];
    if (opt) {
      camSel.value = opt.value;
      await startWith({ deviceId: { exact: opt.value } });
      localStorage.setItem('lastFacing', 'environment');
    } else {
      setStatus('No back camera found.');
    }
  }

  async function start(auto=false) {
    // If a manual device is chosen, honor it
    const selected = camSel.selectedOptions[0];
    if (selected) {
      await startWith({ deviceId: { exact: selected.value } });
      setStatus(auto ? 'Scanning… (auto-start)' : 'Scanning…');
      return;
    }
    // Default to FRONT
    await startFront();
    setStatus(auto ? 'Scanning… (auto-start)' : 'Scanning…');
  }

  function onScanFailure(_) { /* ignore decode failures */ }

  function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastCode && (now - lastScanAt) < COOLDOWN_MS) return;
    lastCode = decodedText;
    lastScanAt = now;

    try { navigator.vibrate && navigator.vibrate(60); } catch {}
    try { beepEl.play().catch(()=>{}); } catch {}

    setStatus('Processing…');
    stop(); // prevent double-read
    sessionStorage.setItem('autoStartScan', '1');   // auto-resume on return
    window.location.replace('/check-in?data=' + encodeURIComponent(decodedText));
  }

  // Pause when tab hidden
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });

  // Controls
  startBtn.addEventListener('click', () => { sessionStorage.setItem('autoStartScan','1'); start(false); });
  stopBtn .addEventListener('click', () => { sessionStorage.removeItem('autoStartScan'); stop(); });
  frontBtn.addEventListener('click', startFront);
  backBtn .addEventListener('click', startBack);
  camSel  .addEventListener('change', async () => {
    const opt = camSel.selectedOptions[0];
    if (opt) await startWith({ deviceId: { exact: opt.value } });
  });

  // Preview flip toggle: if it still looks wrong, tap “Fix preview”
  flipBtn.addEventListener('click', () => {
    scannerEl.classList.toggle('no-flip');
    toast(scannerEl.classList.contains('no-flip') ? 'Preview: raw (no flip)' : 'Preview: corrected (double flip)');
  });

  // Boot
  (async () => {
    // Preflight permission once (then release) so labels populate on iOS
    try {
      const pre = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      pre.getTracks().forEach(t => t.stop());
    } catch (_) {}

    await listCameras();

    const shouldAuto = sessionStorage.getItem('autoStartScan') === '1';
    if (shouldAuto) start(true); else startFront();

    // If you navigate back here, auto-start again
    window.addEventListener('pageshow', () => { if (sessionStorage.getItem('autoStartScan') === '1') start(true); });
  })();
  </script>
</body>
</html>
