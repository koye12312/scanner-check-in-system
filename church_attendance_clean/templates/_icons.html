{#- Inline SVG icons, so pages work without an internet connection.
    Usage: {% from "_icons.html" import icon %} ... {{ icon("check") }} -#}
{% macro icon(name, label=None) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true" focusable="false"{% endif %}>
{%- if name == "scan" -%}
<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/>
{%- elif name == "qr" -%}
<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 14h2M14 18v2M18 18h2v2"/>
{%- elif name == "user-plus" -%}
<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/>
{%- elif name == "users" -%}
<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4.5a4 4 0 0 1 0 7M18 21a7 7 0 0 0-3-5.7"/>
{%- elif name == "check" -%}
<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "check-circle" -%}
<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>
{%- elif name == "logout" -%}
<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/>
{%- elif name == "exit" -%}
<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 7l5 5-5 5M19 12H8"/>
{%- elif name == "search" -%}
<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == "trash" -%}
<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
{%- elif name == "edit" -%}
<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>
{%- elif name == "send" -%}
<path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"/>
{%- elif name == "download" -%}
<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name == "print" -%}
<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>
{%- elif name == "arrow-left" -%}
<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "camera" -%}
<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>
{%- elif name == "switch" -%}
<path d="M4 9h13l-3-3M20 15H7l3 3"/>
{%- elif name == "flip" -%}
<path d="M12 3v18M8 7l-4 5 4 5zM16 7l4 5-4 5z"/>
{%- elif name == "stop" -%}
<rect x="6" y="6" width="12" height="12" rx="2"/>
{%- elif name == "play" -%}
<path d="M7 5l12 7-12 7z"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "alert" -%}
<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17.5v.01"/>
{%- elif name == "info" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>
{%- elif name == "lock" -%}
<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == "refresh" -%}
<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>
{%- elif name == "home" -%}
<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1v-9z"/>
{%- elif name == "grid" -%}
<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>
{%- elif name == "save" -%}
<path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>
{%- elif name == "x" -%}
<path d="M6 6l12 12M18 6L6 18"/>
{%- endif -%}
</svg>
{%- endmacro %}
